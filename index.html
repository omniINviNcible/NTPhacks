<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>T Services Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="navbar">
        <div class="logo">T SERVICES</div>
        <div class="gender-toggle" id="genderToggle">
            <div class="slider"></div>
            <span class="option active">M</span>
            <span class="option">F</span>
        </div>
    </div>
    <div class="container">
        <div class="welcome">Welcome Back, User</div>
        <div class="filters">
            <select id="city">
                <option value="">Select City</option>
                <option value="Delhi">Delhi</option>
                <option value="Mumbai">Mumbai</option>
                <option value="Bangalore">Bangalore</option>
            </select>
            
            <select id="routeSelect">
                <option value="">Select Route</option>
            </select>
        </div>
        
        <div class="cards">
            <div class="card"><h3>Total Buses</h3><span id="buses">--</span></div>
            <div class="card"><h3>Active Routes</h3><span id="activeRoutes">--</span></div>
            <div class="card"><h3>Avg Arrival</h3><span id="arrivalTime">--</span></div>
        </div>

        <div class="map-section">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                <h2>LIVE BUS TRACKING</h2>
                <button id="locateMe" class="locate-btn">📍 My Location</button>
            </div>
            <div class="map-wrapper" id="mapWrapper">
                <div id="map"></div>
                <div id="detailsPanel" class="details-panel">
                    <button class="close-btn" id="closeDetails">&times;</button>
                    <div class="details-content">
                        <h3>Bus Info</h3>
                        <p><strong>ID:</strong> <span id="detBusNo">--</span></p>
                        <p><strong>Type:</strong> <span id="detType">--</span></p>
                        <p><strong>Route:</strong> <span id="detRoute">--</span></p>
                    </div>
                </div>
            </div>
            <div class="location" id="location">📍 Status: Waiting for Selection</div>
        </div>
    </div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="script.js"></script>
</body>
</html>
